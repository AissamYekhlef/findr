[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "findr"
version = "0.1.0"
description = "A web app for working with tabular data stored in files"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    { name = "Findr Team", email = "team@findr.local" }
]
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115,<1",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic[email]>=2.9,<3",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.30",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.4",
    "openpyxl>=3.1.5",
    "duckdb>=1.1",
    "uuid-utils>=0.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.31"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".pytest_cache",
    ".mypy_cache",
    "migrations/versions",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line-too-long (ruff format will handle)
    "W191",   # indentation-contains-tabs
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_no_return = true
exclude = [".venv", "migrations"]

[[tool.mypy.overrides]]
module = ["alembic.*", "duckdb.*", "uuid_utils.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers -v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/tests/*",
    "*/migrations/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
precision = 2
