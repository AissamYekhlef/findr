<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Findr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Schibsted+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Layout: header with Sources and Modules; the sidebar lists sources or modules; the main area is the data workbench or a module page. */
/* Tokens: eight base colors per mode are editable (accent, ground, surface, ink, add, edit, del, info). Everything else is mixed from them, so one change recolors the whole app. */
:root{
  --ground:#EDF0EF; --surface:#FAFBFA; --ink:#16201E;
  --accent:#0A6B60; --accent-ink:#FFFFFF;
  --add:#1F8A4C; --edit:#C98A00; --del:#CC3B3B; --info:#2F6FCB;
  --scrim:rgba(14,24,22,.45);
  --shadow:0 10px 30px rgba(14,30,26,.2);
  --tint:16%; --tone:58%;
  --raise:color-mix(in srgb,var(--ink) 6%,var(--surface));
  --line:color-mix(in srgb,var(--ink) 15%,var(--surface));
  --ink2:color-mix(in srgb,var(--ink) 68%,var(--surface));
  --ink3:color-mix(in srgb,var(--ink) 54%,var(--surface));
  --accent-soft:color-mix(in srgb,var(--accent) var(--tint),var(--surface));
  --add-bg:color-mix(in srgb,var(--add) var(--tint),var(--surface));
  --add-fg:color-mix(in srgb,var(--add) var(--tone),var(--ink));
  --edit-bg:color-mix(in srgb,var(--edit) var(--tint),var(--surface));
  --edit-fg:color-mix(in srgb,var(--edit) var(--tone),var(--ink));
  --del-bg:color-mix(in srgb,var(--del) var(--tint),var(--surface));
  --del-fg:color-mix(in srgb,var(--del) var(--tone),var(--ink));
  --info-bg:color-mix(in srgb,var(--info) var(--tint),var(--surface));
  --info-fg:color-mix(in srgb,var(--info) var(--tone),var(--ink));
  --row-h:38px; --head-h:40px;
  --ui:'Schibsted Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1413; --surface:#151D1B; --ink:#E3EBE8;
    --accent:#3FC1AE; --accent-ink:#06201B;
    --add:#4CC37A; --edit:#E3B341; --del:#EF6B6F; --info:#6FA3EA;
    --scrim:rgba(0,0,0,.6);
    --shadow:0 10px 30px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ground:#0E1413; --surface:#151D1B; --ink:#E3EBE8;
  --accent:#3FC1AE; --accent-ink:#06201B;
  --add:#4CC37A; --edit:#E3B341; --del:#EF6B6F; --info:#6FA3EA;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 10px 30px rgba(0,0,0,.55);
  color-scheme:dark;
}
:root[data-density="compact"]{--row-h:32px;--head-h:34px}
:root[data-density="comfortable"]{--row-h:46px;--head-h:46px}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 var(--ui);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
h1,h2,p{margin:0}
svg.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
:where(button,input,select,[tabindex]):focus-visible{outline:2px solid var(--accent);outline-offset:2px}
td:focus-visible{outline-offset:-2px}
.mono{font-family:var(--mono)}

/* shell */
.app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:17px;letter-spacing:-.01em;min-width:224px}
.brand svg{width:24px;height:24px}
.search{flex:1 1 280px;max-width:520px;display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line);background:var(--ground);border-radius:6px;color:var(--ink2)}
.search:focus-within{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:0}
.search input{flex:1;min-width:0;border:0;background:transparent;outline:0;color:var(--ink)}
.search input::placeholder{color:var(--ink3)}
.search kbd{font:500 11px var(--mono);color:var(--ink3);border:1px solid var(--line);padding:1px 5px;border-radius:4px}
.top .sp{flex:1}
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:0}
.side{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:12px;padding:14px 12px;overflow:auto;min-width:0}
.side-h{font:600 11px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);padding:0 8px}
#srcList{display:flex;flex-direction:column;gap:2px}
.src{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px;border:0;background:transparent;border-radius:6px;cursor:pointer;min-width:0}
.src:hover{background:var(--raise)}
.src[aria-current="true"]{background:var(--accent-soft)}
.src .ic{color:var(--ink2)}
.src[aria-current="true"] .ic{color:var(--accent)}
.src-t{display:flex;flex-direction:column;min-width:0;flex:1}
.src-n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src-s{font:400 11px var(--mono);color:var(--ink2)}
.pip{width:8px;height:8px;border-radius:50%;background:var(--edit-fg);flex:none}
.side-f{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:10px 8px 0;border-top:1px dashed var(--line);font-size:12px;color:var(--ink2)}
.link{border:0;background:none;padding:0;text-align:left;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.head{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 16px 0;display:flex;flex-direction:column;gap:12px}
.fh{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.fi{width:38px;height:38px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);border-radius:8px}
.fi .ic{width:20px;height:20px}
.fm{min-width:0;flex:1 1 220px}
.fm h1{font-size:20px;font-weight:700;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.path{font:400 12px var(--mono);color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fa{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.disk{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink2)}
.disk::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--add-fg)}
.disk.warn{color:var(--edit-fg);font-weight:600}
.disk.warn::before{background:var(--edit-fg)}
.tabs{display:flex;align-items:flex-end;gap:2px;overflow-x:auto;min-height:36px}
.tabs button{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border:1px solid transparent;border-bottom:0;background:transparent;color:var(--ink2);font-weight:500;cursor:pointer;border-radius:6px 6px 0 0;white-space:nowrap}
.tabs button:hover{color:var(--ink);background:var(--raise)}
.tabs button[aria-selected="true"]{background:var(--ground);border-color:var(--line);color:var(--ink);margin-bottom:-1px;height:37px}
.tabs .cnt{font:400 11px var(--mono);color:var(--ink3)}
.fmt{align-self:center;font:400 12px var(--mono);color:var(--ink2);padding-bottom:10px}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding:10px 16px;background:var(--ground)}
.tb-g{display:flex;align-items:center;gap:6px}
.tb-sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 13px/1 var(--ui);border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:var(--raise)}
.btn:disabled{opacity:.45;cursor:default}
.btn.icon{width:32px;padding:0}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover:not(:disabled){background:var(--raise)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
.btn.danger{background:var(--del-bg);border-color:var(--del-fg);color:var(--del-fg)}
.btn.danger:hover:not(:disabled){background:var(--del-bg);filter:brightness(.97)}
.badge{font:500 11px var(--mono);background:var(--accent);color:var(--accent-ink);padding:1px 6px;border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px;border:1px dashed var(--line);background:transparent;color:var(--ink2);border-radius:6px;cursor:pointer;font-weight:500;font-size:13px}
.chip.has{border:1px solid var(--edit-fg);background:var(--edit-bg);color:var(--edit-fg)}
.pwrap{position:relative}
.pop{position:absolute;top:calc(100% + 6px);left:0;z-index:20;min-width:260px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:12px;display:flex;flex-direction:column;gap:10px}
.pop-h{font:600 11px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.pop select,.pop input[type=text]{height:32px;padding:0 8px;border:1px solid var(--line);background:var(--ground);border-radius:6px;width:100%}
.pop label.ck{display:flex;align-items:center;gap:8px;padding:2px 0}

.tablewrap{flex:1 1 auto;min-height:0;overflow:auto;background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{padding:0 12px;height:var(--row-h);border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
thead th{position:sticky;top:0;z-index:2;background:var(--raise);height:var(--head-h);padding:0}
th.ck,td.ck{width:44px;padding:0 0 0 16px}
th .th{display:flex;align-items:center;gap:8px;width:100%;height:var(--head-h);padding:0 12px;border:0;background:transparent;cursor:pointer;font-weight:600;font-size:13px;text-align:left}
th.num .th{justify-content:flex-end}
th .th:hover{background:var(--line)}
th .th .ic{width:13px;height:13px;color:var(--accent)}
.ty{font:400 10px var(--mono);font-style:normal;color:var(--ink3);border:1px solid var(--line);padding:0 4px;border-radius:3px}
td{max-width:300px;overflow:hidden;text-overflow:ellipsis;position:relative;cursor:default}
td.num{text-align:right;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
td.mono{font-family:var(--mono);font-size:13px}
td.ro{color:var(--ink2)}
.auto{font:italic 400 12px var(--mono);color:var(--ink3)}
.tbl tbody tr:not(.new):not(.del):not(.sel):hover td{background:var(--raise)}
.tbl tbody tr.sel td{background:var(--accent-soft)}
.tbl tbody tr.new td{background:var(--add-bg);color:var(--add-fg)}
.tbl tbody tr.del td{background:var(--del-bg);color:var(--del-fg);text-decoration:line-through}
.tbl tbody tr td.ed{background:var(--edit-bg);color:var(--edit-fg);font-weight:500}
.tbl.locked{opacity:.55;pointer-events:none}
td.editing{padding:0 3px;overflow:visible;z-index:3}
.cell-input{width:100%;min-width:130px;height:32px;padding:0 8px;border:2px solid var(--accent);background:var(--surface);color:var(--ink);border-radius:4px;font:inherit}
td.num .cell-input{text-align:right;font-family:var(--mono)}
.cell-input.invalid{border-color:var(--del-fg)}
.cell-err{position:absolute;left:3px;top:calc(100% - 2px);z-index:5;background:var(--del-fg);color:var(--surface);font:500 12px var(--ui);padding:5px 9px;border-radius:4px;white-space:nowrap;text-decoration:none}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 8px;border-radius:4px;background:var(--raise);color:var(--ink2)}
.pill.ok{background:var(--add-bg);color:var(--add-fg)}
.pill.warn{background:var(--edit-bg);color:var(--edit-fg)}
.pill.info{background:var(--info-bg);color:var(--info-fg)}
.pill.bad{background:var(--del-bg);color:var(--del-fg)}
td.none{text-align:center;color:var(--ink2);height:96px;max-width:none}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer;margin:0}

.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 18px;padding:8px 16px;background:var(--ground);font-size:12px;color:var(--ink2)}
.f-l,.f-r{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.legend{display:inline-flex;align-items:center;gap:6px}
.lg{width:10px;height:10px;border-radius:2px;border:1px solid var(--line);display:inline-block}
.lg.add{background:var(--add-bg);border-color:var(--add-fg)}
.lg.ed{background:var(--edit-bg);border-color:var(--edit-fg)}
.lg.del{background:var(--del-bg);border-color:var(--del-fg)}
.legend span{margin-right:6px}
.foot select{height:28px;padding:0 6px;border:1px solid var(--line);background:var(--surface);border-radius:6px}
.pager{display:flex;gap:4px}
.pager .btn{height:28px;width:28px}

.savebar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:10px 16px;background:var(--surface);border-top:2px solid var(--accent)}
.sb-t{display:flex;flex-direction:column;min-width:0}
.sb-t b{font-weight:600}
.sb-t span{font-size:12px;color:var(--ink2)}
.sb-a{display:flex;flex-wrap:wrap;gap:8px}

.empty{flex:1;display:grid;place-content:center;justify-items:center;gap:12px;padding:32px 16px;text-align:center;color:var(--ink2)}
.empty h2{color:var(--ink);font-size:18px}
.empty .ic{width:36px;height:36px;color:var(--accent)}

/* drawer and modal */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow);z-index:41;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer h2{font-size:16px}
#dBody{flex:1;overflow:auto;padding:8px 16px 16px}
#dBody h3{font:600 11px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);margin:14px 0 6px}
#dBody ul{list-style:none;margin:0;padding:0}
.di{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.di div{display:flex;flex-direction:column;min-width:0}
.di b{font-weight:600}
.di span{font:400 12px var(--mono);color:var(--ink2);overflow-wrap:anywhere}
.d-empty{color:var(--ink2);padding:24px 0}
.drawer footer{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.modal{position:fixed;z-index:42;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:14px}
.modal h2{font-size:18px;letter-spacing:-.01em}
.modal p{color:var(--ink2)}
.m-a{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px}
.drop{display:flex;align-items:center;gap:12px;padding:14px;border:1px dashed var(--ink3);border-radius:8px;cursor:pointer}
.drop:hover{background:var(--raise)}
.drop .ic{width:22px;height:22px;color:var(--accent)}
.drop span{display:flex;flex-direction:column;min-width:0}
.drop b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drop small{color:var(--ink2);font-size:12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;align-items:end}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink2);font-weight:500}
.opts select{height:32px;padding:0 8px;border:1px solid var(--line);background:var(--ground);border-radius:6px;color:var(--ink)}
.opts label.ck{flex-direction:row;align-items:center;gap:8px;height:32px;color:var(--ink)}
.m-err{color:var(--del-fg);font-weight:500}
.pv{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pv-h{font:600 11px var(--ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);padding:8px 12px;background:var(--raise)}
.pv-b{overflow-x:auto}
.pv-b table{font-size:12px}
.pv-b th,.pv-b td{height:30px;padding:0 10px;font-family:var(--mono);font-weight:400}
.pv-b th{position:static;background:var(--ground);font-weight:500;color:var(--ink2)}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);z-index:60;max-width:min(520px,calc(100% - 32px));background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:8px;box-shadow:var(--shadow);font-weight:500;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast small{display:block;font:400 11px var(--mono);opacity:.8;margin-top:2px;overflow-wrap:anywhere}

/* shell additions */
.srcview{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;min-width:0}
.src-s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.src .tag{margin-left:auto;flex:none}
.nav{display:flex;align-items:center;gap:4px}
.nav-b{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 12px;border:0;background:transparent;color:var(--ink2);font-weight:600;border-radius:6px;cursor:pointer}
.nav-b:hover{background:var(--raise);color:var(--ink)}
.nav-b[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.nav-b .ic{width:14px;height:14px}
.pop.menu{padding:6px;min-width:min(320px,calc(100vw - 32px))}
.pop.r{left:auto;right:0}
.tag{display:inline-block;font:500 10px/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 5px;border-radius:3px;background:var(--raise);color:var(--ink2);border:1px solid var(--line)}
.tag.live{background:var(--accent-soft);color:var(--accent);border-color:transparent}
textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* module pages */
.modview{flex:1 1 auto;min-height:0;overflow:auto;background:var(--ground)}
.page{max-width:1120px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:20px}
.mod-h{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 16px}
.mod-h h1{font-size:22px;font-weight:700;letter-spacing:-.015em}
.mod-h p{color:var(--ink2);max-width:62ch;margin-top:2px}
.mod-a{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.notice{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;background:var(--info-bg);color:var(--info-fg)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.panel-h .sub{font:400 12px var(--mono);color:var(--ink2)}
.panel-b{padding:16px}
.panel-x{overflow-x:auto;position:relative}
.stack{display:flex;flex-direction:column;gap:12px}
.hint{font-size:12px;color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
.dt{width:100%}
.dt thead th{position:static;height:auto;padding:9px 16px;font:600 11px var(--ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);background:var(--raise);white-space:nowrap}
.dt td{height:auto;padding:10px 16px;max-width:none;overflow:visible;white-space:normal}
.dt tbody tr:last-child td{border-bottom:0}
.dt .c{text-align:center}
.dt td.num,.dt th.num{text-align:right}
.dt td.nowrap{white-space:nowrap}

/* CSV parsing */
function parseCSV(text,d){
  var rows=[],row=[],f='',q=false,i,c;
  for(i=0;i<text.length;i++){c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(function(r){return r.some(function(x){return x!==''})});
}
function infer(vals){
  var v=vals.filter(function(x){return x!==''});
  if(!v.length)return 'text';
  if(v.every(function(x){return /^-?(0|[1-9]\d*)([.,]\d+)?$/.test(x)}))return 'number';
  if(v.every(function(x){return /^\d{4}-\d{2}-\d{2}$/.test(x)}))return 'date';
  return 'text';

function buildCSV(name,text,delim,header,size){

  var head=header?all[0].slice():[];
  while(head.length<n)head.push(header?'column_'+(head.length+1):'column_'+(head.length+1));
  var seen={};head=head.map(function(h,i){h=(h||'').trim()||'column_'+(i+1);if(seen[h]){seen[h]++;h=h+'_'+seen[h]}else seen[h]=1;return h});
  var body=header?all.slice(1):all;
  var cols=head.map(function(h,i){
    var vals=body.map(function(r){return r[i]==null?'':r[i]});
    var t=infer(vals);
    return col('c'+i,h,t,{ro:i===0&&/^(id|sku|key|code)$/i.test(h),mono:t!=='text'});
  });
  var rows=body.map(function(r,ri){
    var o={_id:ri+1};
    cols.forEach(function(c,i){var v=r[i]==null?'':r[i];o[c.key]=c.type==='number'&&v!==''?Number(v.replace(',','.')):v});

function fmtv(c,v){

  return String(v);
}
function validate(type,v){
  if(v==='')return null;
  if(type==='number'&&!/^-?\d+([.,]\d+)?$/.test(v))return 'Enter a number, for example 4500.00';
  if(type==='date'&&!(/^\d{4}-\d{2}-\d{2}$/.test(v)&&!isNaN(Date.parse(v))))return 'Use the date format YYYY-MM-DD';

}
function coerce(type,v){return type==='number'&&v!==''?Number(v.replace(',','.')):v}
function pillCls(v){var k=String(v).toLowerCase();return k==='paid'?'ok':k==='pending'?'warn':k==='shipped'?'info':k==='refunded'?'bad':''}
function cellHTML(c,v,isNew){

function cmp(c,a,b){

function testF(c,v,f){

    case 'gt':return c.type==='number'?(s!==''&&Number(v)>n):s>val;
    case 'lt':return c.type==='number'?(s!==''&&Number(v)<n):(s!==''&&s<val);

/* view */
function computeView(){

  var q=S.q.trim().toLowerCase();
  if(q)rows=rows.filter(function(r){return cols.some(function(c){return String(r.vals[c.key]==null?'':r.vals[c.key]).toLowerCase().indexOf(q)>-1})});
  var f=S.filter;
  if(f){var fc=cols.filter(function(c){return c.key===f.key})[0];if(fc)rows=rows.filter(function(r){return testF(fc,r.vals[fc.key],f)})}
  if(S.sort){var sc=cols.filter(function(c){return c.key===S.sort.key})[0];if(sc){var k=S.sort.dir==='asc'?1:-1;rows=rows.slice().sort(function(a,b){return cmp(sc,a.vals[sc.key],b.vals[sc.key])*k})}}

  S.page=Math.min(Math.max(1,S.page),pages);
  var slice=rows.slice((S.page-1)*S.size,S.page*S.size);
  var adds=S.page===1?p.adds.map(function(a){return {id:a._id,isNew:true,vals:a,del:false,ed:null,orig:null}}):[];
  S.view={list:adds.concat(slice),matched:rows.length,total:d.rows.length+p.adds.length,pages:pages,pageIds:adds.concat(slice).map(function(r){return String(r.id)})};
}

/* editing */

function applyEdit(row,isNew,c,nv){

  var orig=row[c.key],e=p.edits[row._id],curv=(e&&Object.prototype.hasOwnProperty.call(e,c.key))?e[c.key]:orig;
  if(curv===nv)return;

  else{if(!p.edits[row._id])p.edits[row._id]={};p.edits[row._id][c.key]=nv}

function startEdit(td){
  if(S.saving||!td||td.querySelector('input'))return;

  if(!c||c.ro)return;

  if(isNew)row=p.adds.filter(function(a){return a._id===id})[0];
  else{row=d.rows.filter(function(r){return String(r._id)===id})[0];if(row&&p.dels.indexOf(row._id)>-1)return}
  if(!row)return;
  var e=!isNew&&p.edits[row._id],val=(e&&Object.prototype.hasOwnProperty.call(e,c.key))?e[c.key]:row[c.key];
  td.classList.add('editing');
  td.innerHTML='<input class="cell-input" value="'+esc(val==null?'':val)+'" aria-label="Edit '+esc(c.label)+'" autocomplete="off">';
  var inp=td.firstChild,done=false;
  inp.focus();inp.select();
  function finish(mode,move){
    if(done)return;
    var raw=inp.value.trim();
    if(mode==='cancel'){done=true;renderTable();refocus(id,c.key);return}
    var err=validate(c.type,raw);
    if(err){
      if(mode==='blur'){done=true;renderTable();toast('Value not saved. '+err);return}
      inp.classList.add('invalid');
      if(!td.querySelector('.cell-err')){var m=document.createElement('div');m.className='cell-err';m.setAttribute('role','alert');m.textContent=err;td.appendChild(m)}

    else if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();finish('cancel')}

function nextKey(rows,key,type){

}
function addRow(){

function delSel(){
  var s=cur(),p=getPd(s);if(!S.sel.size)return;
  snap();
  S.sel.forEach(function(id){
    if(isNewId(id))p.adds=p.adds.filter(function(a){return a._id!==id});
    else{var n=Number(id);if(p.dels.indexOf(n)<0){p.dels.push(n);delete p.edits[n]}}
  });

function undo(){var s=cur();if(!s||!s.undo.length||S.saving)return;s.redo.push(JSON.stringify(s.pend));s.pend=JSON.parse(s.undo.pop());S.sel.clear();renderAll()}

function revert(d){
  var s=cur(),p=getPd(s,d.sheet),id=toId(d.id);snap();

/* saving */
function stamp(){var d=new Date(),z=function(n){return String(n).padStart(2,'0')};return ''+d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+'-'+z(d.getHours())+z(d.getMinutes())}
function save(force){
  var s=cur(),n=counts(s).n;if(!n||S.saving)return;
  if(s.ext&&!force){
    confirmDlg(s.name+' changed on disk','Another program modified this file after Findr loaded it. Saving now could overwrite those edits.',[
      {label:'Cancel',cls:'ghost'},
      {label:'Reload file',fn:function(){clearPend(s);s.ext=false;S.sel.clear();renderAll();toast('Reloaded '+s.name,'Your pending changes were dropped.')}},
      {label:'Overwrite',cls:'danger',fn:function(){s.ext=false;save(true)}}
    ]);return;
  }
  S.saving=true;closeDrawer();renderAll();
  setTimeout(function(){
    Object.keys(s.pend).forEach(function(sh){
      var p=s.pend[sh],d=s.sheets[sh],idc=d.cols[0];
      d.rows=d.rows.filter(function(r){return p.dels.indexOf(r._id)<0});
      d.rows.forEach(function(r){var e=p.edits[r._id];if(e)Object.assign(r,e)});
      var max=0;d.rows.forEach(function(r){if(r._id>max)max=r._id});
      p.adds.slice().reverse().forEach(function(a){
        var nr=Object.assign({},a,{_id:++max});
        if(idc.ro&&(nr[idc.key]===''||nr[idc.key]==null))nr[idc.key]=nextKey(d.rows,idc.key,idc.type);
        d.rows.push(nr);
      });
    });
    var first=!s.backedUp,bak=s.name+'.bak-'+stamp();
    s.backedUp=true;clearPend(s);S.sel.clear();S.saving=false;renderAll();
    toast('Saved '+n+' change'+(n===1?'':'s')+' to '+s.name,first?'Backup created: '+bak:'');
  },700);
}

function addSrcModal(){
  D={name:'returns.csv',text:SAMPLE,delim:',',enc:'UTF-8',header:true,file:null,err:'',size:'1 KB'};
  modal('<h2>Add a source</h2><p>Choose a CSV file. Findr reads it where it is and writes your changes back to it.</p>'+
    '<label class="drop" for="file">'+ic('file')+'<span><b id="fname">returns.csv (sample file)</b><small>Choose a file, or keep the sample to try it out</small></span></label>'+
    '<input type="file" id="file" accept=".csv,.tsv,.txt,.xlsx,.xls" hidden>'+
    '<div class="opts"><label>Delimiter<select id="oDelim"><option value=",">Comma</option><option value=";">Semicolon</option><option value="\t">Tab</option><option value="|">Pipe</option></select></label>'+
    '<label>Encoding<select id="oEnc"><option>UTF-8</option><option>windows-1252</option></select></label>'+
    '<label class="ck"><input type="checkbox" id="oHdr" checked>First row has column names</label></div>'+
    '<p class="m-err" id="mErr" role="alert" hidden></p>'+
    '<div class="pv"><div class="pv-h">Preview, first 5 rows</div><div class="pv-b" id="pv"></div></div>'+
    '<div class="m-a"><button class="btn ghost" data-m="cancel" data-first>Cancel</button><button class="btn primary" data-m="add" id="mAdd">Add source</button></div>',
  function(m){
    function read(){
      if(!D.file)return;
      var rd=new FileReader();
      rd.onload=function(){D.text=String(rd.result||'');D.delim=detectDelim(D.text);$('#oDelim').value=D.delim;renderPreview()};
      rd.onerror=function(){D.err='This file could not be read.';renderPreview()};
      rd.readAsText(D.file,D.enc);
    }
    m.querySelector('#file').addEventListener('change',function(e){
      var f=e.target.files&&e.target.files[0];if(!f)return;
      D.file=f;D.name=f.name;D.size=Math.max(1,Math.round(f.size/1024))+' KB';D.err='';
      $('#fname').textContent=f.name;
      if(/\.xlsx?$/i.test(f.name)){D.err='Excel files are read by the Findr server. In this mockup, choose a CSV file to try it.';D.text='';renderPreview();return}
      read();
    });
    m.querySelector('#oDelim').addEventListener('change',function(e){D.delim=e.target.value;renderPreview()});
    m.querySelector('#oEnc').addEventListener('change',function(e){D.enc=e.target.value;read()});
    m.querySelector('#oHdr').addEventListener('change',function(e){D.header=e.target.checked;renderPreview()});
    m.addEventListener('click',function(e){
      var b=e.target.closest('[data-m]');if(!b)return;
      if(b.dataset.m==='cancel'){closeModal();return}
      var src=buildCSV(D.name,D.text,D.delim,D.header,D.size);
      if(!src){toast('Nothing to add. The file has no rows.');return}
      S.sources.push(src);closeModal();selectSource(src.id);
      toast(D.name+' added','Opened as a source in Findr.');
    });
  });
  renderPreview();
}

  var n=null;
  if(e.key==='Enter'){e.preventDefault();startEdit(td);return}
  if(e.key==='ArrowRight')n=neighbor(td,1);
  else if(e.key==='ArrowLeft')n=neighbor(td,-1);
  else if(e.key==='ArrowDown')n=vert(td,1);

  else return;
  e.preventDefault();if(n)n.focus();
});

document.addEventListener('keydown',function(e){
  var mod=e.ctrlKey||e.metaKey,tag=e.target.tagName,typing=tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA';
  if(e.key==='Escape'){
    if(!$('#modalWrap').hidden){closeModal();return}
    if(!$('#drawerWrap').hidden){closeDrawer();return}
    closePops();return;
  }
  if(!$('#modalWrap').hidden)return;
  if(S.nav!=='sources')return;
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();if(cur())save();return}
  if(mod&&e.key.toLowerCase()==='f'){e.preventDefault();$('#q').focus();$('#q').select();return}
  if(mod&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();if(e.shiftKey)redo();else undo();return}

});

  if(!rows.length)return '<tr><td colspan="6" class="empty-row">No users match “'+esc(q)+'”.</td></tr>';
  return rows.map(function(u){
    return '<tr><td><div class="who"><span class="av">'+initials(u[0])+'</span><div><b>'+esc(u[0])+'</b><small>'+esc(u[1])+'</small></div></div></td><td><span class="pill">'+u[2]+'</span></td><td>'+userPill(u[3])+'</td><td class="num">'+u[4]+'</td><td class="nowrap">'+esc(u[5])+'</td><td class="c"><button type="button" class="btn ghost" data-v2="Editing a user">Edit</button></td></tr>';
  }).join('');
}
function vUsers(){
  return modHead('Users','People who can open Findr, the role each one has and the sources they can reach.','<button type="button" class="btn primary" data-v2="Inviting users">Invite user</button>')+
  '<section class="panel"><div class="panel-h"><label class="search sm" for="uSearch">'+ic('search')+'<input id="uSearch" type="search" placeholder="Search users" autocomplete="off" aria-label="Search users"></label><span class="sub">'+USERS.length+' users</span></div>'+
  '<div class="panel-x"><table class="dt"><thead><tr><th>User</th><th>Role</th><th>Status</th><th class="num">Sources</th><th>Last active</th><th class="c"><span class="sr">Actions</span></th></tr></thead><tbody id="uBody">'+userRows('')+'</tbody></table></div></section>';
}
function vRoles(){
  var cards=ROLES.map(function(r){var n=USERS.filter(function(u){return u[2]===r[0]}).length;
    return '<article class="panel role"><div class="role-h"><h2>'+r[0]+'</h2><span class="tag">'+n+(n===1?' user':' users')+'</span></div><p>'+r[1]+'</p></article>'}).join('');
  var head='<tr><th>Permission</th>'+ROLES.map(function(r){return '<th class="c">'+r[0]+'</th>'}).join('')+'</tr>';
  var body=PERMS.map(function(p){return '<tr><td>'+p[0]+'</td>'+[1,2,3,4].map(function(i){
    return '<td class="c">'+(p[i]?'<span class="yes" role="img" aria-label="Allowed">'+ic('check')+'</span>':'<span class="no" role="img" aria-label="Not allowed">'+ic('minus')+'</span>')+'</td>'}).join('')+'</tr>'}).join('');
  return modHead('Roles','What each role is allowed to do. Roles are assigned to users.','<button type="button" class="btn primary" data-v2="Creating a role">New role</button>')+
    '<div class="roles">'+cards+'</div>'+
    '<section class="panel"><div class="panel-h"><h2>Permissions</h2></div><div class="panel-x"><table class="dt"><thead>'+head+'</thead><tbody>'+body+'</tbody></table></div></section>';
}
function vHistory(){
  var rows=HIST.map(function(h){return '<tr><td class="nowrap mono">'+esc(h[0])+'</td><td class="nowrap">'+esc(h[1])+'</td><td class="mono nowrap">'+esc(h[2])+'</td><td>'+kindPill(h[3])+'</td><td>'+esc(h[4])+'</td><td class="c"><button type="button" class="btn ghost" data-v2="Restoring a version">Restore</button></td></tr>'}).join('');
  return modHead('History','Every change saved to a file, with the option to go back to an earlier version.','<button type="button" class="btn" data-v2="Exporting the log">Export log</button>')+
    '<section class="panel"><div class="panel-x"><table class="dt"><thead><tr><th>When</th><th>Who</th><th>Source</th><th>Action</th><th>Summary</th><th class="c"><span class="sr">Actions</span></th></tr></thead><tbody>'+rows+'</tbody></table></div></section>';
}

/* ===== theme: presets, editable colors, density ===== */
var MODES=[['system','System'],['light','Light'],['dark','Dark']];
var DENS=[['compact','Compact'],['default','Default'],['comfortable','Comfortable']];
var KEYS=[['accent','Accent'],['ground','Background'],['surface','Surface'],['ink','Text'],['add','Added rows'],['edit','Edited cells'],['del','Deleted rows'],['info','Notices']];
var SEM={light:{add:'#1F8A4C',edit:'#C98A00',del:'#CC3B3B',info:'#2F6FCB'},dark:{add:'#4CC37A',edit:'#E3B341',del:'#EF6B6F',info:'#6FA3EA'}};
function pal(l,d){return {light:Object.assign({},SEM.light,l),dark:Object.assign({},SEM.dark,d)}}
var PRESETS=[
  {id:'teal',name:'Teal',p:pal({accent:'#0A6B60',ground:'#EDF0EF',surface:'#FAFBFA',ink:'#16201E'},{accent:'#3FC1AE',ground:'#0E1413',surface:'#151D1B',ink:'#E3EBE8'})},
  {id:'indigo',name:'Indigo',p:pal({accent:'#4338CA',ground:'#EEEFF6',surface:'#FAFAFD',ink:'#1A1C2E'},{accent:'#8E9BFF',ground:'#0F1020',surface:'#171828',ink:'#E6E8F7'})},
  {id:'graphite',name:'Graphite',p:pal({accent:'#2F4B66',ground:'#ECECEB',surface:'#FAFAF9',ink:'#1D1D1B'},{accent:'#9DB9D6',ground:'#121212',surface:'#1B1B1B',ink:'#E6E6E3'})},
  {id:'copper',name:'Copper',p:pal({accent:'#B04E16',ground:'#F1EEEA',surface:'#FBF9F6',ink:'#2A211B'},{accent:'#E8935A',ground:'#16110D',surface:'#1F1813',ink:'#F0E6DC'})},
  {id:'plum',name:'Plum',p:pal({accent:'#8A2B77',ground:'#F1ECF1',surface:'#FBF8FB',ink:'#261A25'},{accent:'#D98BCB',ground:'#150E15',surface:'#1E141E',ink:'#F1E6F0'})}
];
var TH={mode:'system',preset:'teal',density:'default',custom:{light:{},dark:{}}};
var HEX=/^#[0-9a-f]{6}$/i,themeEl=null;
function presetOf(id){return PRESETS.filter(function(p){return p.id===id})[0]||PRESETS[0]}
function paletteOf(m){return Object.assign({},presetOf(TH.preset).p[m],TH.custom[m])}
function effMode(){var a=document.documentElement.getAttribute('data-theme');if(a==='dark'||a==='light')return a;return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
function shownMode(){var a=document.documentElement.getAttribute('data-theme');return a==='dark'||a==='light'?a:'system'}
function lum(h){var c=[1,3,5].map(function(i){return parseInt(h.substr(i,2),16)/255}).map(function(v){return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function ratio(a,b){var x=lum(a),y=lum(b);return (Math.max(x,y)+.05)/(Math.min(x,y)+.05)}
function readable(bg){return ratio(bg,'#FFFFFF')>=ratio(bg,'#0B1412')?'#FFFFFF':'#0B1412'}
function decl(p){return KEYS.map(function(k){return '--'+k[0]+':'+p[k[0]]}).join(';')+';--accent-ink:'+readable(p.accent)}
function applyTheme(){
  var L=decl(paletteOf('light')),D=decl(paletteOf('dark'));
  themeEl.textContent=':root{'+L+'}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){'+D+';color-scheme:dark}}:root[data-theme="dark"]{'+D+';color-scheme:dark}';
  document.documentElement.setAttribute('data-density',TH.density);
}
function applyMode(user){
  var r=document.documentElement;
  if(TH.mode==='system'){if(user)r.removeAttribute('data-theme')}
  else r.setAttribute('data-theme',TH.mode);
}
function saveTheme(){try{localStorage.setItem('findr.theme',JSON.stringify(TH))}catch(e){}}
function adopt(j,bad){
  if(!j||typeof j!=='object')return false;
  var ok=false,gotColors=false;
  if(PRESETS.some(function(p){return p.id===j.preset})){TH.preset=j.preset;ok=true}
  if(DENS.some(function(d){return d[0]===j.density})){TH.density=j.density;ok=true}
  if(MODES.some(function(m){return m[0]===j.mode})){TH.mode=j.mode;ok=true}
  var src=j.custom||j.colors,next={light:{},dark:{}};
  ['light','dark'].forEach(function(m){
    if(src&&src[m]&&typeof src[m]==='object'){
      gotColors=true;ok=true;
      KEYS.forEach(function(k){
        var v=src[m][k[0]];
        if(v==null)return;
        if(typeof v==='string'&&HEX.test(v)){if(v.toLowerCase()!==presetOf(TH.preset).p[m][k[0]].toLowerCase())next[m][k[0]]=v.toLowerCase()}
        else if(bad)bad.push(m+'.'+k[0]);
      });
    }
  });
  if(gotColors||ok)TH.custom=next;
  return ok;
}
function seg(name,opts,val){
  return '<div class="seg" role="radiogroup" aria-label="'+name+'">'+opts.map(function(o){return '<button type="button" role="radio" aria-checked="'+(o[0]===val)+'" data-opt="'+name+':'+o[0]+'">'+o[1]+'</button>'}).join('')+'</div>';
}
function presetsHTML(){
  var m=effMode();
  return PRESETS.map(function(pr){
    var c=pr.p[m],cust=TH.preset===pr.id&&(Object.keys(TH.custom.light).length+Object.keys(TH.custom.dark).length>0);
    return '<button type="button" class="preset" role="radio" aria-checked="'+(TH.preset===pr.id)+'" data-opt="preset:'+pr.id+'"><span class="dots">'+['accent','ground','surface','ink'].map(function(k){return '<i class="dot" style="background:'+c[k]+'"></i>'}).join('')+'</span><b>'+pr.name+'</b>'+(cust?'<small>Customized</small>':'')+'</button>';
  }).join('');
}
function colorsHTML(p){
  return KEYS.map(function(k){
    var v=p[k[0]];
    return '<div class="crow"><label for="cp_'+k[0]+'">'+k[1]+'</label><input type="color" id="cp_'+k[0]+'" data-color="'+k[0]+'" value="'+v.toLowerCase()+'"><input type="text" id="cx_'+k[0]+'" data-hex="'+k[0]+'" value="'+v.toUpperCase()+'" maxlength="7" spellcheck="false" aria-label="'+k[1]+' hex"></div>';
  }).join('');
}
function checksHTML(){
  var p=paletteOf(effMode()),ac=readable(p.accent);
  var rows=[['Text on surface',ratio(p.ink,p.surface)],['Text on background',ratio(p.ink,p.ground)],['Accent on surface',ratio(p.accent,p.surface)],['Button text on accent',ratio(ac,p.accent)]];
  return rows.map(function(r){var ok=r[1]>=4.5;return '<li><span>'+r[0]+'</span><span class="mono">'+r[1].toFixed(1)+' : 1</span><span class="pill '+(ok?'ok':'bad')+'">'+(ok?'Pass':'Low')+'</span></li>'}).join('');
}
function previewHTML(){
  return '<div class="pvrow"><button type="button" class="btn primary">Save changes</button><button type="button" class="btn">Discard</button><button type="button" class="btn danger">Delete</button><button type="button" class="link">Link</button></div>'+
  '<div class="pvrow"><span class="pill ok">Paid</span><span class="pill warn">Pending</span><span class="pill info">Shipped</span><span class="pill bad">Refunded</span><span class="tag live">Live</span><span class="tag">v2</span></div>'+
  '<div class="panel-x"><table class="tbl dt"><thead><tr><th>Order</th><th>Customer</th><th class="num">Amount</th></tr></thead><tbody>'+
  '<tr><td class="mono">1001</td><td>Karim Benali</td><td class="num">3 200,00</td></tr>'+
  '<tr class="new"><td class="mono"><span class="auto">auto</span></td><td>Amel Saidi</td><td class="num">4 800,00</td></tr>'+
  '<tr><td class="mono">1003</td><td class="ed">Yacine Mebarki</td><td class="num">11 500,00</td></tr>'+
  '<tr class="del"><td class="mono">1004</td><td>Lina Hamdi</td><td class="num">6 900,00</td></tr></tbody></table></div>';
}
function exportTheme(){return JSON.stringify({findrTheme:1,mode:shownMode(),preset:TH.preset,density:TH.density,colors:{light:paletteOf('light'),dark:paletteOf('dark')}},null,2)}
function syncJson(){var j=$('#thJson');if(j&&document.activeElement!==j)j.value=exportTheme()}
function vAppearance(){
  var m=effMode(),p=paletteOf(m);
  return modHead('Appearance','Choose a mode and a preset, or set each color yourself. Changes apply straight away and stay in this browser.','',true)+
  '<div class="ap-grid"><div class="ap-col">'+
    '<section class="panel"><div class="panel-h"><h2>Mode</h2></div><div class="panel-b stack">'+seg('mode',MODES,shownMode())+'<p class="hint">System follows your device. You are editing the '+m+' palette. Switch the mode to edit the other one.</p></div></section>'+
    '<section class="panel"><div class="panel-h"><h2>Preset</h2></div><div class="panel-b"><div class="presets" role="radiogroup" aria-label="Preset">'+presetsHTML()+'</div></div></section>'+
    '<section class="panel"><div class="panel-h"><h2>Colors <span class="tag">'+m+'</span></h2><button type="button" class="btn ghost" data-th="reset-colors">Reset to preset</button></div><div class="panel-b">'+colorsHTML(p)+'<p class="hint" style="margin-top:10px">Borders, muted text, hover and the row tints are mixed from these colors automatically.</p></div></section>'+
    '<section class="panel"><div class="panel-h"><h2>Density</h2></div><div class="panel-b stack">'+seg('density',DENS,TH.density)+'<p class="hint">Table row height: 32, 38 or 46 px.</p></div></section>'+
  '</div><div class="ap-col sticky">'+
    '<section class="panel"><div class="panel-h"><h2>Preview</h2></div><div class="panel-b pvbox" inert>'+previewHTML()+'</div></section>'+
    '<section class="panel"><div class="panel-h"><h2>Readability</h2><span class="sub">Target 4.5 : 1</span></div><div class="panel-b"><ul class="checks" id="thChecks">'+checksHTML()+'</ul></div></section>'+
  '</div></div>'+
  '<section class="panel"><div class="panel-h"><h2>Theme file</h2><div class="mod-a"><button type="button" class="btn ghost" data-th="reset-all">Reset appearance</button><button type="button" class="btn" data-th="copy-json">Copy</button><button type="button" class="btn primary" data-th="apply-json">Apply</button></div></div><div class="panel-b stack"><textarea id="thJson" class="json" spellcheck="false" aria-label="Theme file"></textarea><p class="hint">Copy this text to share your theme. Paste a theme here and press Apply to use it.</p></div></section>';
}
function setColor(k,v,fromText){
  var m=effMode(),base=presetOf(TH.preset).p[m][k];
  if(v.toLowerCase()===base.toLowerCase())delete TH.custom[m][k];else TH.custom[m][k]=v.toLowerCase();
  applyTheme();saveTheme();
  var p=paletteOf(m),pk=$('#cp_'+k),tx=$('#cx_'+k),ck=$('#thChecks');
  if(pk&&fromText)pk.value=p[k].toLowerCase();
  if(tx&&document.activeElement!==tx)tx.value=p[k].toUpperCase();
  if(ck)ck.innerHTML=checksHTML();
  syncJson();
}
function copyJson(){
  var ta=$('#thJson');if(!ta)return;
  var fail=function(){ta.focus();ta.select();toast('Press Ctrl C to copy the selected text')};
  try{navigator.clipboard.writeText(ta.value).then(function(){toast('Theme copied')},fail)}catch(e){fail()}
}
function applyJson(){
  var ta=$('#thJson'),j,bad=[];
  try{j=JSON.parse(ta.value)}catch(e){toast('That text is not valid JSON','Check for a missing quote or comma.');return}
  if(!adopt(j,bad)){toast('Nothing to apply','A theme needs a preset, a mode, a density or colors.');return}
  applyMode(true);applyTheme();saveTheme();themeRefresh();
  toast(bad.length?'Theme applied, '+bad.length+' value'+(bad.length===1?'':'s')+' skipped':'Theme applied',bad.slice(0,4).join(', '));
}
function fillTheme(){
  $('#pTheme').innerHTML='<div class="pop-h">Mode</div>'+seg('mode',MODES,shownMode())+'<div class="pop-h">Preset</div><div class="presets sm" role="radiogroup" aria-label="Preset">'+presetsHTML()+'</div><button type="button" class="link" data-mod="appearance">Customize colors and density</button>';
}
function themeRefresh(){
  if(!$('#pTheme').hidden)fillTheme();
  if(S.nav==='module'&&S.mod==='appearance')renderModule(true);
}
function initTheme(){
  try{adopt(JSON.parse(localStorage.getItem('findr.theme')||'null'))}catch(e){}
  themeEl=document.createElement('style');themeEl.id='userTheme';document.body.appendChild(themeEl);
  applyTheme();applyMode(false);
  var mq=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)');
  if(mq&&mq.addEventListener)mq.addEventListener('change',themeRefresh);
  new MutationObserver(themeRefresh).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
}

/* ===== navigation and module rendering ===== */
var MOD_VIEWS={dashboard:vDashboard,users:vUsers,roles:vRoles,history:vHistory,appearance:vAppearance};
function modItem(m){
  var on=S.nav==='module'&&S.mod===m.id;
  return '<button type="button" class="src" data-mod="'+m.id+'" aria-current="'+on+'">'+ic(m.icon)+'<span class="src-t"><span class="src-n">'+m.name+'</span><span class="src-s">'+esc(m.sub)+'</span></span><span class="tag'+(m.live?' live':'')+'">'+(m.live?'Live':'v2')+'</span></button>';
}
function fillMods(){$('#pMods').innerHTML=MODS.map(modItem).join('')}
function renderNav(){
  var inSrc=S.nav==='sources';
  $('#srcView').hidden=!inSrc;$('#modView').hidden=inSrc;
  $('#hdrSearch').hidden=!inSrc;$('#bExport').hidden=!inSrc;
  $('#navSources').setAttribute('aria-current',inSrc?'page':'false');
  $('#navMods').setAttribute('aria-current',inSrc?'false':'page');
  $('#navPip').hidden=inSrc||!S.sources.some(function(s){return counts(s).n>0});
}
function renderModule(keep){
  var m=MODS.filter(function(x){return x.id===S.mod})[0]||MODS[0],mv=$('#modView'),top=keep?mv.scrollTop:0;
  mv.innerHTML='<div class="page">'+MOD_VIEWS[m.id]()+'</div>';
  mv.scrollTop=top;
  if(m.id==='appearance')syncJson();
}
function openModule(id){
  S.nav='module';S.mod=id;closePops();closeDrawer();renderAll();
  $('#modView').scrollTop=0;window.scrollTo(0,0);
}
var tip=null;
function showTip(el){
  if(!tip){tip=document.createElement('div');tip.className='tip';tip.setAttribute('role','tooltip');document.body.appendChild(tip)}
  tip.innerHTML=el.dataset.tip;tip.hidden=false;
  var r=el.getBoundingClientRect();tip.style.left=Math.round(r.left+r.width/2)+'px';tip.style.top=Math.round(r.top-6)+'px';
}
function hideTip(){if(tip)tip.hidden=true}

$('#navSources').addEventListener('click',function(){closePops();if(S.nav!=='sources'){S.nav='sources';renderAll()}});
$('#navMods').addEventListener('click',function(){togglePop($('#navMods'),$('#pMods'),fillMods)});
$('#bTheme').addEventListener('click',function(){togglePop($('#bTheme'),$('#pTheme'),fillTheme)});

document.addEventListener('click',function(e){
  var t=e.target;if(!t.closest)return;
  var el=t.closest('[data-v2]');
  if(el){toast(el.dataset.v2+' arrives in v2','This page shows example data only.');return}
  el=t.closest('[data-mod]');
  if(el){openModule(el.dataset.mod);return}
  el=t.closest('[data-opt]');
  if(el){
    var kv=el.dataset.opt.split(':'),k=kv[0],v=kv[1];
    if(k==='mode'){TH.mode=v;applyMode(true)}
    else if(k==='density'){TH.density=v;applyTheme()}
    else if(k==='preset'){TH.preset=v;TH.custom={light:{},dark:{}};applyTheme()}
    saveTheme();themeRefresh();return;
  }
  el=t.closest('[data-th]');
  if(el){
    var a=el.dataset.th;
    if(a==='reset-colors'){TH.custom[effMode()]={};applyTheme();saveTheme();themeRefresh();toast('Colors reset to the '+presetOf(TH.preset).name+' preset')}
    else if(a==='reset-all'){TH.mode='system';TH.preset='teal';TH.density='default';TH.custom={light:{},dark:{}};applyMode(true);applyTheme();saveTheme();themeRefresh();toast('Appearance reset')}
    else if(a==='copy-json')copyJson();
    else if(a==='apply-json')applyJson();
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.color){setColor(t.dataset.color,t.value,false);return}
  if(t.id==='uSearch'){$('#uBody').innerHTML=userRows(t.value)}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.hex){
    var v=t.value.trim();if(v.charAt(0)!=='#')v='#'+v;
    if(HEX.test(v))setColor(t.dataset.hex,v,true);
    else{toast('Use a six-digit hex color, for example #0A6B60');t.value=paletteOf(effMode())[t.dataset.hex].toUpperCase()}
  }
});
var mv=$('#modView');
mv.addEventListener('mouseover',function(e){var c=e.target.closest('.col');if(c)showTip(c)});
mv.addEventListener('mouseout',function(e){if(e.target.closest('.col'))hideTip()});
mv.addEventListener('focusin',function(e){var c=e.target.closest('.col');if(c)showTip(c)});
mv.addEventListener('focusout',hideTip);
mv.addEventListener('scroll',hideTip);

initTheme();

renderAll();
})();
</script>

</body></html>
