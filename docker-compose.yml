version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: findr-postgres
    environment:
      POSTGRES_DB: findr
      POSTGRES_USER: findr_user
      POSTGRES_PASSWORD: dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U findr_user -d findr"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: findr-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://findr_user:dev_password@postgres:5432/findr
      ENVIRONMENT: local
      DEBUG: "true"
      LOG_LEVEL: INFO
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    command: uvicorn src.app.main:app --reload --host 0.0.0.0 --port 8000

volumes:
  postgres_data:
